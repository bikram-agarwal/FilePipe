[versions]
# BOM material3 is older; this line tracks the expressive build used by the app (override BOM for this artifact).
activityCompose = "1.13.0"
agp = "9.4.0-alpha08"
appcompat = "1.8.0"
composeBom = "2026.08.00"
composeMaterial3Adaptive = "1.3.0"
composeMaterial3Expressive = "1.5.0-alpha26"
coreKtx = "1.19.0"
coroutines = "1.11.0"
datastore = "1.2.1"
detekt = "2.0.0-alpha.6"
documentfile = "1.1.0"
exifinterface = "1.4.2"
gradleVersionsPlugin = "0.61.0"
hilt = "2.60.1"
hiltNav = "1.4.0"
java = "21"
junit = "4.13.2"
kotlin = "2.4.20-RC"
kotlinLogging = "8.0.4"
ksp = "2.3.11"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
lifecycle = "2.11.0"
materialKolor = "5.0.0"
nav = "2.9.8"
paging = "3.5.1"
reorderable = "3.1.0"
room = "2.8.4"
sarif4k = "0.7.0"
serialization = "1.11.0"
splashscreen = "1.2.0"
work = "2.11.2"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMaterial3Expressive" }
compose-material3-expressive = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3Expressive" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
detekt-sarif4k = { module = "io.github.detekt.sarif4k:sarif4k", version.ref = "sarif4k" }
detekt-sarif4k-jvm = { module = "io.github.detekt.sarif4k:sarif4k-jvm", version.ref = "sarif4k" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
errorprone-annotations = "com.google.errorprone:error_prone_annotations:2.50.0"
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-nav-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNav" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltNav" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltNav" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
nav-compose = { module = "androidx.navigation:navigation-compose", version.ref = "nav" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
versions = { id = "io.github.ben-manes.versions", version.ref = "gradleVersionsPlugin" }
